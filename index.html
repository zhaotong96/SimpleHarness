<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>SimpleHarness</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="layout">
  <aside id="sidebar">
    <div id="sidebar-header">
      <span id="sidebar-title">分支图谱</span>
      <button id="new-branch-btn" title="新建对话">+</button>
    </div>
    <div id="graph-container">
      <div id="graph"></div>
    </div>
  </aside>
  <main id="main">
    <div id="sys"></div>
    <div id="chat"></div>
    <div id="bar">
      <div id="preview"></div>
      <div id="bar-controls">
        <span id="usage"></span>
        <select id="server"></select>
        <select id="model"></select>
        <label><input type="checkbox" id="think" checked> thinking</label>
        <label id="upload-label" title="添加附件 (支持多文本与图片)"><input type="file" id="file" multiple hidden>📎</label>
        <textarea id="input" rows="2" placeholder="说点什么，支持拖拽/粘贴多个文件或图片，Ctrl+Enter 发送"></textarea>
        <button id="send">发送</button>
      </div>
    </div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
